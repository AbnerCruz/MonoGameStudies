plugins {
    id 'com.android.application'
}

android {
    namespace 'org.mobileforge.samplegame'
    compileSdk 35

    defaultConfig {
        applicationId 'org.mobileforge.samplegame'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
