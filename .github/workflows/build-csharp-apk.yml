name: Build MobileForge example APK
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - 'csharp-src/android/**'
      - 'csharp-src/scripts/smoke.mjs'
      - '.github/workflows/build-csharp-apk.yml'
permissions:
  contents: read
jobs:
  android-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install WebAssembly tools and browser
        working-directory: csharp-src
        run: |
          dotnet workload install wasm-tools
          npm install --no-audit --no-fund
          npm run bundle
          npx playwright install --with-deps chromium
      - name: Build C# runtimes
        working-directory: csharp-src
        run: |
          dotnet publish ForgeRuntime.csproj -c Release -o out/editor
          dotnet publish ForgeRuntime.csproj -c Release -o out/player -p:ForgePlayer=true
          cp -R out/editor/wwwroot/_framework wwwroot/_framework
          python scripts/pack.py out/player/wwwroot wwwroot/player-framework.pack.gz
      - name: Verify C# game and prepare APK asset
        working-directory: csharp-src
        env:
          FORGE_APK_SAMPLE: android/app/src/main/assets/game.html
        run: node scripts/smoke.mjs
      - name: Build signed debug APK
        working-directory: csharp-src/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK package and signature
        working-directory: csharp-src/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging "$APK" | head -4
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose "$APK"
          unzip -l "$APK" | grep 'assets/game.html'
      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: bash csharp-src/android/check-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MobileForge-CSharp-Example-APK
          path: csharp-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
