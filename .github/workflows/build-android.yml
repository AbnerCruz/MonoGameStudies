name: Build MobileForge Android

on:
  push:
    branches: [mobileforge-prototype]
    paths: ['mobileforge/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build editor APK
        run: dotnet build mobileforge/src/Editor/MobileForge.Editor.csproj -c Debug -f net9.0-android -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true -p:RuntimeIdentifier=android-arm64 -p:DebugSymbols=false -p:DebugType=None -p:SatelliteResourceLanguages=pt
      - name: Verify APK signature and metadata
        run: |
          APK=$(find mobileforge/src/Editor/bin/Debug -name "org.mobileforge.editor-Signed.apk" -type f | head -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: MobileForge-Android-APKs
          path: |
            mobileforge/src/Editor/bin/Debug/**/*-Signed.apk
          if-no-files-found: error
