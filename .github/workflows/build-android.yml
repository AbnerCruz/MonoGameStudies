name: Build MobileForge Android

on:
  push:
    branches: [mobileforge-prototype]
    paths: ['mobileforge/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build editor APK
        run: dotnet build mobileforge/src/Editor/MobileForge.Editor.csproj -c Debug -f net9.0-android -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
      - name: Build sample standalone APK
        run: dotnet build mobileforge/src/GameTemplate/MobileForge.Game.csproj -c Debug -f net9.0-android -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
      - name: Install and launch editor in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            adb install mobileforge/src/Editor/bin/Debug/net9.0-android/org.mobileforge.editor-Signed.apk
            adb shell am start -n org.mobileforge.editor/crc64a2e9c73616ba1620.MainActivity || adb shell monkey -p org.mobileforge.editor 1
      - uses: actions/upload-artifact@v4
        with:
          name: MobileForge-Android-APKs
          path: |
            mobileforge/src/Editor/bin/Debug/net9.0-android/*-Signed.apk
            mobileforge/src/GameTemplate/bin/Debug/net9.0-android/*-Signed.apk
          if-no-files-found: error
